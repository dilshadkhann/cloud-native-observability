[project]
name = "cloud-native-observability"
version = "0.1.0"
description = "Locally runnable observability platform: FastAPI, Prometheus, Grafana, Docker Compose"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "prometheus-client==0.26.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.uv]
cache-dir = ".uv-cache"
python-preference = "only-system"
python-downloads = "never"